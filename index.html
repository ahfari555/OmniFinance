<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFinance - US Financial Calculators</title>
  <meta name="google-site-verification" content="google45274bc7d9133ca5" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2805918301542012" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
    <div class="font-black text-xl text-blue-600">📈 OmniFinance</div>
    <div class="text-xs font-semibold bg-blue-50 text-blue-600 px-3 py-1 rounded-full">US Financial Suite</div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-12 flex-1 space-y-6">
    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
      <h1 class="text-2xl md:text-3xl font-black text-slate-900">US Mortgage & Loan Payment Calculator</h1>
      <p class="text-xs text-slate-500">Calculate your monthly mortgage or loan payments instantly.</p>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">Loan Amount ($):</label>
          <input type="number" id="loanAmt" value="350000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">Interest Rate (% APR):</label>
          <input type="number" step="0.1" id="loanRate" value="6.5" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs">
        </div>
      </div>

      <button onclick="calcLoan()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl text-xs transition">
        Calculate Payment 📊
      </button>

      <div id="resultBox" class="hidden bg-slate-100 p-6 rounded-2xl text-center space-y-2">
        <div class="text-xs font-bold uppercase text-slate-500">Estimated Monthly Payment</div>
        <div id="resMonthly" class="text-3xl font-black text-blue-600">$0</div>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    © 2026 OmniFinance. All rights reserved. | <a href="privacy.html" class="underline">Privacy Policy</a>
  </footer>

  <script>
    function calcLoan() {
      const p = parseFloat(document.getElementById('loanAmt').value) || 0;
      const r = (parseFloat(document.getElementById('loanRate').value) || 0) / 100 / 12;
      const n = 30 * 12;
      const monthly = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      document.getElementById('resMonthly').innerText = '$' + Math.round(monthly).toLocaleString();
      document.getElementById('resultBox').classList.remove('hidden');
    }
  </script>
</body>
</html>
